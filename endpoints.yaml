# Source of truth for the gateway's endpoints.
#
# `make gen` expands this into config/settings/endpoints.json (committed), which
# krakend.tmpl ranges over at render time. Endpoints with `auth: public` are the
# ones added to the JWT plugin's skip_paths — never edit that list by hand.
#
# Anything under x-* is anchor scaffolding for this file only; the generator
# ignores unknown top-level keys.

x-header-sets:
  # Public routes: no identity headers reach the backend.
  anonymous: &anonymous
    - Accept
    - Content-Type
    - Traceparent
    - Tracestate
  # Protected routes: identity claims injected by the jwt-headers plugin.
  identity: &identity
    - Accept
    - Accept-Language
    - Content-Type
    - Authorization
    - x-user-id
    - x-user-roles
    - x-username
    - x-org-slug
    - X-Organization-Id
    - x-ip
    - Idempotency-Key
    - Traceparent
    - Tracestate
    - X-Traceparent

  # MCP Streamable HTTP: identity claims plus the protocol/session headers the
  # transport needs (Mcp-Session-Id round-trips, Last-Event-ID resumes a stream).
  mcp: &mcp
    - Accept
    - Content-Type
    - Authorization
    - Mcp-Session-Id
    - Mcp-Protocol-Version
    - Last-Event-ID
    - x-user-id
    - x-user-roles
    - x-username
    - x-org-slug
    - X-Organization-Id
    - x-ip
    - Traceparent
    - Tracestate
    - X-Traceparent

  # The OIDC flow and the session endpoints. Cookie is the point: auth-bff reads
  # __Host-sid on /auth/session and /auth/logout, and Spring stores the
  # authorization request (state + PKCE verifier) in its own HTTP session, so
  # JSESSIONID must survive the hop from /auth/login to /auth/callback or state
  # validation fails. No identity headers: the jwt-headers plugin skips these
  # routes, so there is nothing to inject.
  auth: &auth
    - Accept
    - Content-Type
    - Cookie
    - Traceparent
    - Tracestate
    - X-Traceparent

backends:
  forgeos:
    host_default: http://host.docker.internal:8080
    host_env: FORGEOS_HOST
  knowledge:
    host_default: http://host.docker.internal:8085
    host_env: KNOWLEDGE_MCP_HOST
  auth_bff:
    host_default: http://host.docker.internal:8086
    host_env: AUTH_BFF_HOST

defaults:
  output_encoding: no-op
  encoding: no-op
  timeout: null

endpoints:
  # Edge authentication (auth-bff). Every route here is `public` in the gateway's
  # sense — it lands in the JWT plugin's skip_paths — because this IS the flow
  # that issues the credential. There is no token to validate yet.
  #
  # /internal/sessions/{sid}/refresh is deliberately NOT routed: the
  # session-resolver plugin calls auth-bff directly, and that endpoint hands out
  # access tokens behind nothing but a shared secret. Exposing it at the edge
  # would put an access-token oracle on the public internet.
  - path: /auth/login/keycloak
    method: GET
    backend: auth_bff
    auth: public
    input_headers: *auth

  # Keycloak redirects the browser here with the authorization code. The query
  # parameters must be declared explicitly or KrakenD drops them and the flow
  # dies with a missing-code error that looks like a Keycloak fault.
  - path: /auth/callback
    method: GET
    backend: auth_bff
    auth: public
    timeout: 10s
    input_headers: *auth
    input_query_strings:
      - code
      - state
      - session_state
      - iss
      - error
      - error_description

  - path: /auth/session
    method: GET
    backend: auth_bff
    auth: public
    input_headers: *auth

  - path: /auth/logout
    method: POST
    backend: auth_bff
    auth: public
    timeout: 10s
    input_headers: *auth

  # Keycloak calls this server-to-server with a signed logout_token; no browser,
  # no cookie. Its authentication is the token signature, validated in auth-bff.
  - path: /auth/backchannel-logout
    method: POST
    backend: auth_bff
    auth: public
    timeout: 10s
    input_headers:
      - Accept
      - Content-Type
      - Traceparent
      - Tracestate
      - X-Traceparent

  - path: /api/ping
    method: GET
    backend: forgeos
    auth: public
    input_headers: *anonymous

  - path: /api/organizations
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/organizations
    method: POST
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/organizations/{orgId}/members
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects
    method: POST
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/hub
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/summary
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/description
    method: PUT
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/stories
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/stories
    method: POST
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/board
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/refinement/turns
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/projects/{projectId}/refinement/turns
    method: POST
    backend: forgeos
    auth: protected
    input_headers: *identity

  - path: /api/stories/{id}
    method: GET
    backend: forgeos
    auth: protected
    input_headers: *identity

  # SSE streams — no-op passthrough with a 3600s timeout so the progress stream
  # survives the 3s service timeout; host sanitize is off to keep the raw URL.
  - path: /api/projects/{projectId}/refinement/stream
    method: GET
    backend: forgeos
    auth: protected
    timeout: 3600s
    disable_host_sanitize: true
    input_headers: *identity

  - path: /api/stories/{id}/refinement/stream
    method: GET
    backend: forgeos
    auth: protected
    timeout: 3600s
    disable_host_sanitize: true
    input_headers: *identity

  - path: /api/agent-runs/{id}/stream
    method: GET
    backend: forgeos
    auth: protected
    timeout: 3600s
    disable_host_sanitize: true
    input_headers: *identity

  # Knowledge catalog MCP (spring-ai-qdrant-mcp) — Streamable HTTP transport.
  # One block per method: POST carries JSON-RPC, GET is the long-lived server
  # stream, DELETE terminates the session.
  - path: /mcp
    method: POST
    backend: knowledge
    auth: protected
    timeout: 120s
    disable_host_sanitize: true
    input_headers: *mcp

  - path: /mcp
    method: GET
    backend: knowledge
    auth: protected
    timeout: 3600s
    disable_host_sanitize: true
    input_headers: *mcp

  - path: /mcp
    method: DELETE
    backend: knowledge
    auth: protected
    timeout: 30s
    input_headers: *mcp

  # REST surface of the same use cases, for non-MCP clients.
  - path: /api/v1/search
    method: POST
    backend: knowledge
    auth: protected
    timeout: 60s
    input_headers: *identity

  # Ingest accepts up to 4MB and runs chunking plus embeddings inline.
  - path: /api/v1/documents
    method: POST
    backend: knowledge
    auth: protected
    timeout: 300s
    input_headers: *identity

  - path: /api/v1/memories
    method: POST
    backend: knowledge
    auth: protected
    timeout: 60s
    input_headers: *identity

  - path: /api/v1/collections
    method: GET
    backend: knowledge
    auth: protected
    input_headers: *identity

  - path: /api/v1/projects
    method: GET
    backend: knowledge
    auth: protected
    input_headers: *identity

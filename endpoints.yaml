# Source of truth for the gateway's endpoints.
#
# `make gen` expands this into config/settings/endpoints.json (committed), which
# krakend.tmpl ranges over at render time. Endpoints with `auth: public` are the
# ones added to the JWT plugin's skip_paths — never edit that list by hand.
#
# Anything under x-* is anchor scaffolding for this file only; the generator
# ignores unknown top-level keys.
#
# WHAT BELONGS HERE. Only the platform's own surface: the OIDC and session flow
# that issues the credential this gateway validates. Application routes were
# removed on 2026-10-12 (ForgeOS 18, knowledge 8) and are loaded per application
# by a mechanism still being chosen. Adding an application's routes back into
# this file is what that change was meant to prevent.
#
# The two header sets below have no route using them today, and they stay on
# purpose: they are the gateway's contract, not any application's. `identity` is
# exactly the list the jwt-headers plugin injects, so a route that declares
# anything else either drops a claim the backend needs or forwards a header the
# caller controls.

x-header-sets:
  # Public routes: no identity headers reach the backend.
  anonymous: &anonymous
    - Accept
    - Content-Type
    - Traceparent
    - Tracestate
  # Protected routes: identity claims injected by the jwt-headers plugin.
  identity: &identity
    - Accept
    - Accept-Language
    - Content-Type
    - Authorization
    - x-user-id
    - x-user-roles
    - x-username
    - x-org-slug
    - X-Organization-Id
    - x-ip
    - Idempotency-Key
    - Traceparent
    - Tracestate
    - X-Traceparent

  # The OIDC flow and the session endpoints. Cookie is the point: auth-bff reads
  # __Host-sid on /auth/session and /auth/logout, and Spring stores the
  # authorization request (state + PKCE verifier) in its own HTTP session, so
  # JSESSIONID must survive the hop from /auth/login to /auth/callback or state
  # validation fails. No identity headers: the jwt-headers plugin skips these
  # routes, so there is nothing to inject.
  auth: &auth
    - Accept
    - Content-Type
    - Cookie
    - Traceparent
    - Tracestate
    - X-Traceparent

# A product is the unit of loading. PRODUCTS is consumed by gen/check, not dev:
# to load a subset, run `make gen PRODUCTS=a,b` then `make dev` — dev does not
# regenerate endpoints.json, it uses what's on disk. `prefix` is prepended to the
# exposed path and never reaches the backend; `platform` keeps prefix "" so no
# route moves.
#
# One product left means the filter has nothing to filter today. It stays because
# it is also what ADR-0007 names as the way a second deployment serves a
# different catalogue without a second image.
products:
  platform:
    prefix: ""
    backend: auth_bff

backends:
  auth_bff:
    host_default: http://host.docker.internal:8086
    host_env: AUTH_BFF_HOST

defaults:
  output_encoding: no-op
  encoding: no-op
  timeout: null

endpoints:
  # Edge authentication (auth-bff). Every route here is `public` in the gateway's
  # sense — it lands in the JWT plugin's skip_paths — because this IS the flow
  # that issues the credential. There is no token to validate yet.
  #
  # /internal/sessions/{sid}/refresh is deliberately NOT routed: the
  # session-resolver plugin calls auth-bff directly, and that endpoint hands out
  # access tokens behind nothing but a shared secret. Exposing it at the edge
  # would put an access-token oracle on the public internet.
  - path: /auth/login/{provider}
    method: GET
    backend: auth_bff
    product: platform
    auth: public
    input_headers: *auth
    rate_limit:
      max_rate: 20
      client_max_rate: 5
      strategy: ip

  # Keycloak redirects the browser here with the authorization code. The query
  # parameters must be declared explicitly or KrakenD drops them and the flow
  # dies with a missing-code error that looks like a Keycloak fault.
  - path: /auth/callback
    method: GET
    backend: auth_bff
    product: platform
    auth: public
    timeout: 10s
    input_headers: *auth
    input_query_strings:
      - code
      - state
      - session_state
      - iss
      - error
      - error_description
    rate_limit:
      max_rate: 20
      client_max_rate: 5
      strategy: ip

  - path: /auth/session
    method: GET
    backend: auth_bff
    product: platform
    auth: public
    input_headers: *auth

  - path: /auth/logout
    method: POST
    backend: auth_bff
    product: platform
    auth: public
    timeout: 10s
    input_headers: *auth

  # Keycloak calls this server-to-server with a signed logout_token; no browser,
  # no cookie. Its authentication is the token signature, validated in auth-bff.
  - path: /auth/backchannel-logout
    method: POST
    backend: auth_bff
    product: platform
    auth: public
    timeout: 10s
    input_headers:
      - Accept
      - Content-Type
      - Traceparent
      - Tracestate
      - X-Traceparent

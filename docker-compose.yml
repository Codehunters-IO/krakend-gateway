services:
  krakend:
    image: krakend:2.13.4
    ports:
      - "8090:8090"
      - "8443:8443"
    volumes:
      - ./config:/etc/krakend
      - ./plugins/build:/opt/krakend/plugins
      - ./certs:/etc/krakend/certs:ro
    extra_hosts:
      # Reach host-published services (backend :8080, Keycloak :8083) from inside the container.
      # macOS Docker Desktop provides host.docker.internal natively; this makes Linux work too.
      - "host.docker.internal:host-gateway"
    environment:
      - FC_ENABLE=1
      - FC_SETTINGS=/etc/krakend/settings
      - FC_OUT=/tmp/krakend.json
      # ForgeOS backend (default in hosts.json). Override to retarget.
      - FORGEOS_HOST=${FORGEOS_HOST:-http://host.docker.internal:8080}
      # Knowledge catalog (MCP + REST).
      - KNOWLEDGE_MCP_HOST=${KNOWLEDGE_MCP_HOST:-http://host.docker.internal:8085}
      # Keycloak forgeos realm. issuer must equal the token `iss`; JWKS resolved from inside the container.
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://localhost:8083/realms/forgeos}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-http://host.docker.internal:8083/realms/forgeos/protocol/openid-connect/certs}
      # Feature-flags de plugins/módulos. Vacío = usa el "enabled" del JSON.
      # Set "true"/"false" para forzar override en cualquier dirección.
      - GATEWAY_TIMEOUT_ENABLED=${GATEWAY_TIMEOUT_ENABLED:-}
      - ACCEPT_LANGUAGE_ENABLED=${ACCEPT_LANGUAGE_ENABLED:-}
      - TRACE_CONTEXT_ENABLED=${TRACE_CONTEXT_ENABLED:-}
      - IP_RESOLVER_ENABLED=${IP_RESOLVER_ENABLED:-}
      - JWT_ENABLED=${JWT_ENABLED:-}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:-}
    labels:
      observability.service: "forgeos-gw-krakend"
      observability.environment: "develop"
      observability.domain: "gateway"
    command: ["run", "-d", "-c", "/etc/krakend/krakend.tmpl"]

services:
  krakend:
    image: krakend:2.13.4
    ports:
      - "8000:8080"
      - "8001:8090"
      - "8443:8443"
    volumes:
      - ./config:/etc/krakend
      - ./plugins/build:/opt/krakend/plugins
      - ./certs:/etc/krakend/certs:ro
    environment:
      - FC_ENABLE=1
      - FC_SETTINGS=/etc/krakend/settings
      - FC_OUT=/tmp/krakend.json
      - EXAMPLE_HOST=${EXAMPLE_HOST:-http://example-service:8080}
      # Keycloak (override para apuntar a tu realm; default en jwt.json)
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-}
    labels:
      observability.service: "krakend-gateway"
      observability.environment: "develop"
      observability.domain: "gateway"
    command: ["run", "-d", "-c", "/etc/krakend/krakend.tmpl"]

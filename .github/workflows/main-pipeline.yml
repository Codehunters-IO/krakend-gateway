name: Deploy to Cert

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  checks: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: Codehunters-IO/ci-templates/.github/workflows/krakend-main-pipeline.yml@v2
    with:
      run_commit_lint: false
      run_build: true
      run_test: true
      # No deploy environment exists yet (no `cert` environment, no AWS/EC2/WireGuard
      # secrets), so main only builds and tests. Turn both back on once `cert` is set up.
      run_artifact: false
      run_deploy: false
      run_cleanup: false
      run_release: false
      deploy_target: 'ec2-vpn'
      environment: 'cert'
    secrets: inherit

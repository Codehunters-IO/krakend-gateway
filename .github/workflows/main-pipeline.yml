name: Deploy to Cert

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  checks: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    # Pinned, not floating: @v2 moves. On 2026-10-06 two consecutive pushes to main
    # failed and the next one passed with a functionally identical caller — only the
    # tag's target had changed in between. What deploys must not depend on when it
    # runs. Bump deliberately; v2.2.1 is 1da8c1e.
    uses: Codehunters-IO/ci-templates/.github/workflows/krakend-main-pipeline.yml@v2.2.1
    with:
      run_commit_lint: false
      run_build: true
      run_test: true
      # No deploy environment exists yet (no `cert` environment, no AWS/EC2/WireGuard
      # secrets), so main only builds and tests. Turn both back on once `cert` is set up.
      run_artifact: false
      run_deploy: false
      run_cleanup: false
      run_release: false
      deploy_target: 'ec2-vpn'
      environment: 'cert'
    secrets: inherit

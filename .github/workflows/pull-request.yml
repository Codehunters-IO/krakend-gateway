name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write

jobs:
  validate:
    uses: Codehunters-IO/ci-templates/.github/workflows/krakend-main-pipeline.yml@v1
    with:
      run_commit_lint: true
      run_build: true
      run_test: true
    secrets: inherit
